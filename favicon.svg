<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="128" fill="#1F1F1C"/>
  <circle cx="256" cy="256" r="220" fill="#721C2B" stroke="#3D3D36" stroke-width="8"/>
  <g transform="translate(256, 256)" stroke="#F3ECE2" fill="#F3ECE2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Fork on left, angled -->
    <g transform="rotate(-25) translate(-40, -110)">
      <!-- Handle -->
      <path d="M 0 90 L 0 210" stroke-width="18" fill="none"/>
      <circle cx="0" cy="210" r="12"/>
      <!-- Neck and Base -->
      <path d="M -24 50 C -24 85 24 85 24 50 Z" stroke-width="8"/>
      <!-- Tines -->
      <path d="M -22 10 L -22 50 M -8 10 L -8 50 M 8 10 L 8 50 M 22 10 L 22 50" stroke-width="10" stroke-linecap="round"/>
    </g>
    <!-- Spoon on right, angled -->
    <g transform="rotate(25) translate(40, -110)">
      <!-- Handle -->
      <path d="M 0 90 L 0 210" stroke-width="18" fill="none"/>
      <circle cx="0" cy="210" r="12"/>
      <!-- Bowl -->
      <ellipse cx="0" cy="45" rx="30" ry="46" stroke-width="8"/>
    </g>
  </g>
</svg>
