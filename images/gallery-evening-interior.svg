<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D121B" />
      <stop offset="50%" stop-color="#1E1E1B" />
      <stop offset="100%" stop-color="#181816" />
    </linearGradient>
    <radialGradient id="ambience" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#842234" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#232320" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1A1A18" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)" />
  <circle cx="600" cy="380" r="320" fill="url(#ambience)" />
  
  <!-- Subtle rattan ring pattern -->
  <circle cx="600" cy="360" r="240" fill="none" stroke="#CBB79F" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.35" />
  <circle cx="600" cy="360" r="210" fill="none" stroke="#CBB79F" stroke-width="0.75" opacity="0.25" />

  <!-- Logo Mark -->
  <g transform="translate(600, 240)">
    <circle cx="0" cy="0" r="46" fill="#842234" stroke="#CBB79F" stroke-width="2" />
    <text x="0" y="16" font-family="'Bodoni Moda', 'Playfair Display', Georgia, serif" font-size="42" font-weight="800" fill="#EDE6DC" text-anchor="middle">B</text>
  </g>

  <!-- Category Tag -->
  <text x="600" y="340" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="5" fill="#CBB79F" text-anchor="middle" text-transform="uppercase">
    AMBIANCE • BREEZE KADUNA
  </text>

  <!-- Title -->
  <text x="600" y="410" font-family="'Bodoni Moda', 'Playfair Display', Georgia, serif" font-size="50" font-weight="700" fill="#EDE6DC" text-anchor="middle">
    Intimate Evening Dining
  </text>

  <!-- Subtitle -->
  <text x="600" y="460" font-family="'Inter', system-ui, sans-serif" font-size="20" fill="#B2ADA5" text-anchor="middle">
    Warm Stone, Ambient Glow &amp; Fine Comfort
  </text>
</svg>