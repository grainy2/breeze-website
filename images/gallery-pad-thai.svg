<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A1125" />
      <stop offset="50%" stop-color="#24181E" />
      <stop offset="100%" stop-color="#152D21" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6E1B3A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#141012" stop-opacity="0.95"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)" />
  <circle cx="600" cy="380" r="320" fill="url(#glow)" />
  
  <!-- Subtle rattan ring pattern -->
  <circle cx="600" cy="360" r="240" fill="none" stroke="#C8A97E" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.4" />
  <circle cx="600" cy="360" r="210" fill="none" stroke="#C8A97E" stroke-width="0.75" opacity="0.3" />

  <!-- Logo Mark -->
  <g transform="translate(600, 240)">
    <circle cx="0" cy="0" r="44" fill="#6E1B3A" stroke="#C8A97E" stroke-width="2" />
    <text x="0" y="14" font-family="Playfair Display, Georgia, serif" font-size="40" font-weight="bold" fill="#F8F6F4" text-anchor="middle">B</text>
  </g>

  <!-- Category Tag -->
  <text x="600" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#C8A97E" text-anchor="middle" text-transform="uppercase">
    Food • BREEZE KADUNA
  </text>

  <!-- Title -->
  <text x="600" y="400" font-family="Playfair Display, Georgia, serif" font-size="44" font-weight="600" fill="#F8F6F4" text-anchor="middle">
    Artisan Noodle Craft
  </text>

  <!-- Subtitle -->
  <text x="600" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#A7979F" text-anchor="middle">
    Fresh Tamarind &amp; Crushed Nuts
  </text>

  <!-- Footer note -->
  <text x="600" y="720" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="2" fill="#6C5D64" text-anchor="middle" text-transform="uppercase">
    Photography Asset Placeholder • Replace with high-res photograph
  </text>
</svg>